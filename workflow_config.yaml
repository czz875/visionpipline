# CJET 数据生产工作流配置（项目级覆盖入口）
# 完整配置在 tools/cfg/ 下，结构：
#   - tools/cfg/default.yaml       系统默认
#   - tools/cfg/workflow.yaml      完整工作流 stage 定义
#   - tools/cfg/workflow.example.yaml  给用户看的完整示例
# 本文件（workflow_config.yaml）只放项目级覆盖，tools/workflow.py 会自动
# 叠加 default + workflow + 本文件。
#
# 跑法（与之前完全一样）：
#   .conda\python.exe tools\workflow.py --config workflow_config.yaml --dry-run
#   .conda\python.exe tools\workflow.py --config workflow_config.yaml --from-stage backup_snapshot

# ---------- 项目特定覆盖 ----------
# 完整 path 列表与默认值见 tools/cfg/default.yaml
paths:
  backup_dir: C:/Users/EDY/Pictures
  autolabel: datasets/autolabel
  behavior: datasets/behavior

# ---------- 不覆盖 stage ----------
# 所有 stage 都在 tools/cfg/workflow.yaml 里定义；本任务相关的 4 个 stage
# （backup_snapshot / inherit_dataset / fix_labelme / rename_with_labelme_sync）
# 默认已 enabled。如需单独禁用某 stage，加在这里：
#
# stages:
#   - name: backup_snapshot
#     enabled: false
