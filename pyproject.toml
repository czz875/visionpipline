[build-system]
# 本项目不是要发布的包，只借用 pyproject 承载工具配置；
# 声明 setuptools 是为了让 pip install -e . 之类的操作有明确的构建后端。
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionpipline"
version = "0.1.0"
description = "数据生产 + 模型训练流水线：自动标注、清洗、拆分、训练、归档"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
# 只声明包目录，避免把 datasets/weight 等大目录卷进构建。
packages = ["tools"]

[tool.pytest.ini_options]
# 让 `pytest tests\` 在仓库根直接跑通：把仓库根加入 sys.path，
# 这样 tests 里的 `from tools.xxx import ...` 无需额外设置 PYTHONPATH。
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --basetemp=.pytest_tmp"
# 说明：缓存与临时目录改用仓库内的 .pytest_tmp，避开 %TEMP%\pytest-of-EDY 与
# 仓库根 .pytest_cache —— 这两处在某些沙箱会话下会被写入无法读取的权限，
# 导致 tmp_path 用例集体报错（表现为 100+ 个 error 而非真实测试失败）。
# 两者都是可再生目录，不影响测试结果。
# 跳过 ultralytics 在导入期写入的缓存目录告警噪音。
filterwarnings = [
    "ignore::DeprecationWarning:ultralytics.*",
]
